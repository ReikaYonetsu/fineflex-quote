<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FINE-FLEX 自動お見積り | SILFINE JAPAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<style>
:root{
  --paper:#F4F6FB; --surface:#FFFFFF; --ink:#222631; --muted:#5E6675; --line:#DCE1EC;
  --blue:#2448C2; --blue-deep:#1B3A93; --blue-soft:#EAF0FC; --sky:#8FC1D6;
  --yellow:#F6D46B; --yellow-soft:#FFF7DA; --orange:#EFB13B; --field:#F0F0F0;
  --ok:#2E7D4F; --danger:#C62828; --focus:#2448C2;
  --cell:#1B3A63; --cell-hi:#2C5C96; --busbar:#C9D3DD;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:16px;line-height:1.75;letter-spacing:.04em;-webkit-font-smoothing:antialiased}
.en{font-family:"Poppins","Noto Sans JP",sans-serif;letter-spacing:.06em}
.num{font-variant-numeric:tabular-nums;letter-spacing:.02em}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
a{color:var(--blue)}

.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:72px}
.brand{text-decoration:none;color:var(--blue-deep);line-height:1.2}
.brand b{display:block;font-family:"Poppins",sans-serif;font-weight:700;font-size:22px;letter-spacing:.14em}
.brand small{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.08em}
.hdr-r{display:flex;align-items:center;gap:14px}
.back{font-size:13px;font-weight:500;color:var(--blue);text-decoration:none;white-space:nowrap}
.back:hover{text-decoration:underline}
@media (max-width:560px){.back{display:none}.brand small{display:none}.langs button{padding:4px 10px;font-size:12px}}
.langs{flex:none}.langs button{white-space:nowrap}
.langs{display:flex;border:1.5px solid var(--blue);border-radius:999px;overflow:hidden}
.langs button{border:0;background:#fff;color:var(--blue);padding:5px 14px;cursor:pointer;font-size:13px;font-weight:500}
.langs button[aria-pressed="true"]{background:var(--blue);color:#fff}

.intro{padding:56px 0 40px;text-align:center}
.intro .big{font-family:"Poppins",sans-serif;font-weight:700;font-size:clamp(56px,11vw,120px);line-height:1;letter-spacing:.06em;margin:0;
  background:linear-gradient(90deg,var(--blue) 0%,#4B79C9 45%,var(--sky) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.intro h1{font-size:clamp(22px,3.2vw,30px);margin:10px 0 18px;font-weight:700;letter-spacing:.2em;color:var(--ink)}
.intro p{margin:0 auto;max-width:44em;color:var(--muted)}
.mode-note{display:inline-block;margin-top:20px;font-size:13px;padding:5px 14px;border-radius:999px;background:var(--yellow-soft);border:1px solid var(--yellow)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start;padding-bottom:72px}
@media (max-width:960px){.layout{grid-template-columns:1fr}}

section.step{padding:0 0 40px}
.step h2{position:relative;margin:0 0 6px;padding:12px 64px 12px 18px;font-size:18px;font-weight:700;letter-spacing:.12em;color:#fff;
  background:var(--blue);clip-path:polygon(0 0,100% 0,calc(100% - 36px) 100%,0 100%);display:flex;gap:12px;align-items:center}
.step h2 .n{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--blue);
  font-family:"Poppins",sans-serif;font-size:14px;font-weight:700;flex:none;letter-spacing:0}
.step .hint{margin:12px 0 18px;color:var(--muted);font-size:14px}

.choices{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.choice{display:flex;gap:10px;align-items:flex-start;padding:14px 16px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;transition:border-color .15s}
.choice:hover{border-color:#9EB2E6}
.choice:has(input:checked){border-color:var(--blue);background:var(--blue-soft)}
.choice input{margin-top:6px;accent-color:var(--blue)}
.choice .t{font-weight:700;font-size:15px;color:var(--blue-deep)}
.choice .d{font-size:12px;color:var(--muted);display:block;line-height:1.6}

.panels{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.panel-card{position:relative;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:border-color .15s}
.panel-card:hover{border-color:#9EB2E6}
.panel-card[aria-checked="true"]{border-color:var(--blue);background:var(--blue-soft)}
.panel-art{height:84px;display:flex;align-items:center;justify-content:center;perspective:500px;margin-bottom:10px}
.panel-art svg{max-height:84px;max-width:100%;transition:transform .5s cubic-bezier(.3,.7,.2,1);transform-origin:50% 100%}
.panel-card[aria-checked="true"] .panel-art svg{transform:rotateX(28deg) scaleY(.92)}
.panel-card.framed[aria-checked="true"] .panel-art svg{transform:none}
@media (prefers-reduced-motion:reduce){.panel-art svg{transition:none}}
.panel-card .model{font-family:"Poppins",sans-serif;font-weight:600;font-size:15px;color:var(--blue-deep);letter-spacing:.03em}
.badges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px;min-height:22px}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:#fff;letter-spacing:.02em}
.badge.rec{background:var(--yellow);border-color:var(--yellow);color:#4A3200;font-weight:700}
.badge.stock{border-color:var(--ok);color:var(--ok)}
.panel-card dl{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;margin:0;font-size:12.5px}
.panel-card dt{color:var(--muted)}
.panel-card dd{margin:0;text-align:right}
.panel-card .price{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-weight:700;display:flex;justify-content:space-between;font-size:13.5px}

.field{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.field label,.lbl{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.field .sub{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;border-radius:999px;padding:1px 9px;letter-spacing:.06em;flex:none}
.tag.req{background:var(--blue)} .tag.opt{background:var(--orange)}
input[type=text],input[type=email],input[type=tel],input[type=number],select,textarea{
  width:100%;padding:11px 14px;border:1.5px solid transparent;border-radius:4px;background:var(--field)}
select{border-color:var(--line);background:#fff}
textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff;outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:170px 1fr;gap:16px}
@media (max-width:560px){.row2,.row3{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1.5px solid var(--blue);border-radius:999px;overflow:hidden;margin-bottom:16px}
.seg button{border:0;background:#fff;color:var(--blue);padding:8px 18px;cursor:pointer;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.stepper{display:flex;align-items:stretch;max-width:240px}
.stepper button{width:46px;border:0;background:var(--blue);color:#fff;cursor:pointer;font-size:20px}
.stepper button:first-child{border-radius:999px 0 0 999px}
.stepper button:last-child{border-radius:0 999px 999px 0}
.stepper input{border-radius:0;text-align:center}
.facts{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:6px;font-size:14px;color:var(--muted)}
.facts b{color:var(--blue-deep);font-weight:700}
.check{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;cursor:pointer;font-size:15px}
.check input{width:18px;height:18px;margin-top:5px;accent-color:var(--blue);flex:none}
.err{color:var(--danger);font-size:14px;min-height:1.2em}
.note{font-size:13px;color:var(--muted);margin:-8px 0 16px;padding:10px 14px;background:var(--yellow-soft);border-left:4px solid var(--yellow)}

aside.summary{position:sticky;top:calc(88px + env(safe-area-inset-top,0px));background:#fff;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgba(27,58,147,.08)}
@media (max-width:960px){aside.summary{position:static}}
.sum-head{color:#fff;padding:20px 22px;background:linear-gradient(120deg,var(--blue) 0%,var(--blue-deep) 100%)}
.sum-head .lbl{font-size:13px;opacity:.9;font-weight:500;display:block}
.sum-head .total{font-family:"Poppins",sans-serif;font-size:36px;font-weight:700;line-height:1.2;letter-spacing:.02em}
.sum-head .per{font-size:13px;opacity:.9}
.sum-body{padding:16px 22px 22px}
.lines{width:100%;border-collapse:collapse;font-size:14px}
.lines td{padding:6px 0;vertical-align:top}
.lines td:last-child{text-align:right;white-space:nowrap;padding-left:12px}
.lines .nt{display:block;font-size:12px;color:var(--muted)}
.lines tr.sep td{border-top:1px solid var(--line);padding-top:10px}
.lines tr.disc td:last-child{color:var(--ok)}
.lines tr.grand td{font-weight:700;font-size:16px;color:var(--blue-deep)}
.benefits{margin:16px 0;border-radius:10px;background:var(--yellow-soft);border:1px solid var(--yellow);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px}
.benefits b{display:block;font-size:17px;line-height:1.35;color:var(--blue-deep)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:10px;width:100%;padding:15px 22px;border-radius:999px;
  border:0;cursor:pointer;font-weight:700;font-size:16px;letter-spacing:.1em;background:var(--blue-deep);color:#fff;transition:background .15s}
.btn::before{content:"";width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg)}
.btn:hover{background:var(--blue)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:#fff;border:1.5px solid var(--blue);color:var(--blue);font-weight:500;font-size:14px;padding:8px 16px;width:auto;letter-spacing:.04em}
.btn.ghost::before{display:none}
.btn.ghost:hover{background:var(--blue-soft)}
.fine{font-size:12px;color:var(--muted);margin:10px 0 0}

.saved{padding:32px 0 0;border-top:1px solid var(--line)}
.saved h2{color:var(--blue-deep)}
.table-wrap{overflow-x:auto;border:1.5px solid var(--line);border-radius:10px;background:#fff}
table.list{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
table.list th,table.list td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.list th{font-weight:500;color:var(--muted);font-size:13px;background:var(--paper)}
table.list tr:last-child td{border-bottom:0}
table.list .r{text-align:right}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
.link{background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;color:var(--blue);font-size:14px}

footer.site{background:var(--blue-deep);color:#fff;padding:56px 0 0}
footer.site .cols{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end}
@media (max-width:760px){footer.site .cols{grid-template-columns:1fr}}
footer.site .en-big{font-family:"Poppins",sans-serif;font-weight:700;font-size:clamp(40px,6vw,60px);line-height:1;letter-spacing:.04em;margin:0}
footer.site .jp{font-size:15px;font-weight:700;letter-spacing:.2em;margin:6px 0 24px}
footer.site .tel{font-family:"Poppins",sans-serif;font-size:clamp(26px,3.6vw,36px);font-weight:600;color:#fff;text-decoration:none;letter-spacing:.06em}
footer.site address{font-style:normal;font-size:13px;line-height:1.9;opacity:.9;margin-top:14px}
footer.site .pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:420px;padding:14px;border:1.5px solid #fff;border-radius:4px;color:#fff;text-decoration:none;font-weight:700;letter-spacing:.1em}
footer.site .pill:hover{background:rgba(255,255,255,.1)}
footer.site .copy{margin-top:48px;padding:16px 0;text-align:center;font-size:12px;background:#16307A;letter-spacing:.08em}

dialog{border:0;padding:0;border-radius:14px;max-width:min(840px,calc(100vw - 24px));width:100%;background:#fff;color:var(--ink)}
dialog::backdrop{background:rgba(16,30,70,.55)}
.dlg-bar{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center;background:var(--paper)}
.dlg-msg{margin-right:auto;font-size:14px;color:var(--ok);font-weight:500}
.sheet{padding:32px;max-height:75vh;overflow:auto;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--blue-deep);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10;max-width:90vw}
.toast.show{opacity:1}

.q-doc{font-size:13px;color:#18222F;background:#fff;line-height:1.6;letter-spacing:.02em}
.q-doc h1{font-size:26px;letter-spacing:.3em;text-align:center;margin:0 0 20px;font-weight:700}
.q-doc .q-meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:14px}
.q-doc .q-to{font-size:16px;border-bottom:1px solid #18222F;padding-bottom:4px;min-width:240px}
.q-doc .q-total{border:2px solid #18222F;padding:10px 14px;display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:14px 0}
.q-doc table{width:100%;border-collapse:collapse;margin-top:8px}
.q-doc th,.q-doc td{border:1px solid #B8C0C9;padding:6px 8px;text-align:left;vertical-align:top}
.q-doc th{background:#EEF1F4;font-weight:500}
.q-doc td.r{text-align:right;white-space:nowrap}
.q-doc .q-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:14px}
.q-doc .q-cols h3{font-size:13px;margin:0 0 4px}
.q-doc .q-cols ul{margin:0;padding-left:18px}
.q-doc .q-from{text-align:right;font-size:12px;margin-top:16px}
.q-doc .q-notes{margin-top:12px;font-size:11.5px;color:#444;padding-left:18px}
@media (max-width:560px){.sheet{padding:18px}.q-doc h1{font-size:20px}.q-doc .q-cols{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="https://www.silfine.jp/"><b>SILFINE</b><small data-t="brandSub"></small></a>
    <div class="hdr-r">
      <a class="back" href="https://www.silfine.jp/fineflex.php" data-t="backLink"></a>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="intro">
    <p class="big" aria-hidden="true">Estimate</p>
    <h1 data-t="title"></h1>
    <p data-t="lede"></p>
    <span class="mode-note" id="modeNote"></span>
  </div>

  <div class="layout">
    <div>
      <section class="step" aria-labelledby="s1">
        <h2 id="s1"><span class="n">1</span><span data-t="s1"></span></h2>
        <p class="hint" data-t="s1h"></p>
        <div class="choices" id="surfaces" role="radiogroup" aria-labelledby="s1"></div>
      </section>

      <section class="step" aria-labelledby="s2">
        <h2 id="s2"><span class="n">2</span><span data-t="s2"></span></h2>
        <p class="hint" data-t="s2h"></p>
        <div class="panels" id="panels" role="radiogroup" aria-labelledby="s2"></div>
      </section>

      <section class="step" aria-labelledby="s3">
        <h2 id="s3"><span class="n">3</span><span data-t="s3"></span></h2>
        <p class="hint" data-t="s3h"></p>
        <div class="seg" role="group">
          <button type="button" data-mode="count" aria-pressed="true" data-t="byCount"></button>
          <button type="button" data-mode="area" aria-pressed="false" data-t="byArea"></button>
        </div>
        <div class="field" id="countField">
          <label for="count" data-t="countLbl"></label>
          <div class="stepper">
            <button type="button" id="minus" aria-label="−">−</button>
            <input type="number" id="count" min="1" max="5000" value="24" class="num">
            <button type="button" id="plus" aria-label="+">+</button>
          </div>
        </div>
        <div class="field" id="areaField" hidden>
          <label for="area" data-t="areaLbl"></label>
          <input type="number" id="area" min="1" max="100000" value="100" class="num" style="max-width:240px">
          <span class="sub" data-t="areaSub"></span>
        </div>
        <div class="facts" id="facts"></div>
      </section>

      <section class="step" aria-labelledby="s4">
        <h2 id="s4"><span class="n">4</span><span data-t="s4"></span></h2>
        <p class="hint" data-t="s4h"></p>
        <div class="lbl" style="margin-bottom:8px" data-t="installLbl"></div>
        <div class="choices" id="installs" role="radiogroup"></div>
        <p class="note" id="surfaceNote" hidden></p>
        <label class="check"><input type="checkbox" id="pcs" checked><span data-t="pcsLbl"></span></label>
        <div class="row2">
          <div class="field"><label for="battery" data-t="batteryLbl"></label><select id="battery"></select></div>
          <div class="field"><label for="pref" data-t="prefLbl"></label><select id="pref"></select></div>
        </div>
      </section>

      <section class="step" aria-labelledby="s5">
        <h2 id="s5"><span class="n">5</span><span data-t="s5"></span></h2>
        <p class="hint" data-t="s5h"></p>
        <div class="field"><label for="cCompany"><span class="tag opt" data-t="opt"></span><span data-t="cCompany"></span></label><input type="text" id="cCompany" autocomplete="organization" maxlength="100"></div>
        <div class="row2">
          <div class="field"><label for="cName"><span class="tag req" data-t="req"></span><span data-t="cName"></span></label><input type="text" id="cName" autocomplete="name" maxlength="100"></div>
          <div class="field"><label for="cKana"><span class="tag opt" data-t="opt"></span><span data-t="cKana"></span></label><input type="text" id="cKana" maxlength="100"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="cEmail"><span class="tag req" data-t="req"></span><span data-t="cEmail"></span></label><input type="email" id="cEmail" autocomplete="email" maxlength="200"></div>
          <div class="field"><label for="cTel"><span class="tag opt" data-t="opt"></span><span data-t="cTel"></span></label><input type="tel" id="cTel" autocomplete="tel" maxlength="30"></div>
        </div>
        <div class="row3">
          <div class="field"><label for="cZip"><span class="tag opt" data-t="opt"></span><span data-t="cZip"></span></label><input type="text" id="cZip" autocomplete="postal-code" maxlength="10" placeholder="811-0125"></div>
          <div class="field"><label for="cAddr"><span class="tag opt" data-t="opt"></span><span data-t="cAddr"></span></label><input type="text" id="cAddr" autocomplete="address-line1" maxlength="200"></div>
        </div>
        <div class="field"><label for="cNotes"><span class="tag opt" data-t="opt"></span><span data-t="cNotes"></span></label><textarea id="cNotes" maxlength="2000"></textarea></div>
        <div aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden"><label>Website<input type="text" id="hpWebsite" tabindex="-1" autocomplete="off"></label></div>
        <label class="check"><input type="checkbox" id="consent"><span id="consentText"></span></label>
        <div class="err" id="formErr" role="alert"></div>
      </section>

      <section class="saved" aria-labelledby="savedH">
        <h2 id="savedH" style="font-size:20px;margin:0 0 4px" data-t="savedH"></h2>
        <p class="fine" style="margin:0 0 12px" data-t="savedSub"></p>
        <div class="table-wrap" id="savedList"></div>
      </section>
    </div>

    <aside class="summary" aria-live="polite">
      <div class="sum-head">
        <div class="lbl" data-t="estTotal"></div>
        <div class="total num" id="total">—</div>
        <div class="per num" id="perKw"></div>
      </div>
      <div class="sum-body">

/* ---------------- state ---------------- */
const $ = s => document.querySelector(s);
const state = { lang:"ja", surface:"flat", model:"SFJ-400-EWH", mode:"count", count:24, area:100,
  install:"adhesive", pcs:true, battery:"none", pref:39 };
const t = k => T[state.lang][k];
const L = o => o[state.lang];
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = (s, n) => s.replace("{n}", n);
let sb = null; // Supabase client when connected

const product = id => PRODUCTS.find(p => p.id === id) || PRODUCTS[0];
const surface = id => SURFACES.find(s => s.id === id);
const areaM2 = p => p.length_mm * p.width_mm / 1e6;

/* ---------------- calculation ---------------- */
function calc(){
  const p = product(state.model), S = SETTINGS;
  const n = state.mode === "count"
    ? Math.max(1, Math.min(5000, Math.floor(state.count) || 1))
    : Math.max(1, Math.min(5000, Math.floor((state.area * 0.85) / areaM2(p))));
  const kw = n * p.watts / 1000;
  const lines = [];
  const panelsCost = n * p.price_jpy;
  lines.push({k:"lPanels", note:`${p.id} × ${n}`, v:panelsCost, qty:n, unit:"unitPcs", up:p.price_jpy});
  const disc = [...S.volume_discounts].sort((a,b) => b.min - a.min).find(d => n >= d.min);
  if (disc) lines.push({k:"lDisc", note:`${Math.round(disc.rate*100)}%`, v:-Math.round(panelsCost*disc.rate)});
  const perKw = S.install_per_kw[state.install] || 0;
  if (state.install !== "none"){
    lines.push({k:"lInstall", note:L(METHODS[state.install])[0], v:Math.round(perKw*kw), qty:+kw.toFixed(2), unit:"unitKw", up:perKw});
    lines.push({k:"lSurvey", v:S.survey_fee, qty:1, unit:"unitSet", up:S.survey_fee});
  }
  if (state.pcs) lines.push({k:"lPcs", v:Math.round(S.pcs_per_kw*kw), qty:+kw.toFixed(2), unit:"unitKw", up:S.pcs_per_kw});
  const bat = BATTERIES.find(b => b.id === state.battery);
  if (bat.price) lines.push({k:"lBattery", note:L(bat), v:bat.price, qty:1, unit:"unitSet", up:bat.price});
  const zone = zoneOf(state.pref);
  const ship = (S.shipping_per_50[zone] || 0) * Math.ceil(n/50);
  lines.push({k:"lShip", note:(state.lang==="ja"?PREFS_JA:PREFS_EN)[state.pref], v:ship, qty:1, unit:"unitSet", up:ship});
  const sub = lines.reduce((a,l) => a + l.v, 0);
  const tax = Math.round(sub * S.tax_rate);
  const total = sub + tax;
  const gen = Math.round(kw * S.yield_kwh_per_kw);
  const savings = Math.round(gen * S.electricity_yen_per_kwh);
  const panelArea = n * areaM2(p);
  const weight = n * p.weight_kg;
  const glass = panelArea * S.glass_kg_per_m2;
  return { p, n, kw, lines, sub, tax, total, gen, savings,
    payback: savings > 0 ? total / savings : null,
    panelArea, weight, lighter: Math.max(0, glass - weight) };
}

/* ---------------- rendering ---------------- */
function panelSVG(p){
  const framed = p.panel_type === "framed";
  const W = 170, H = Math.round(W * p.width_mm / p.length_mm);
  const cols = Math.max(4, Math.round(p.length_mm / 182 / 2)), rows = Math.max(2, Math.round(p.width_mm / 182));
  const pad = framed ? 7 : 4, cw = (W - pad*2) / cols, ch = (H - pad*2) / rows;
  let cells = "";
  for (let r=0; r<rows; r++) for (let c=0; c<cols; c++){
    cells += `<rect x="${pad+c*cw+.7}" y="${pad+r*ch+.7}" width="${cw-1.4}" height="${ch-1.4}" rx="1" fill="var(--cell)"/>`;
  }
  cells += `<line x1="${W/2}" y1="${pad}" x2="${W/2}" y2="${H-pad}" stroke="var(--busbar)" stroke-width=".8" opacity=".8"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">
    <rect x="${framed?1.5:.5}" y="${framed?1.5:.5}" width="${W-(framed?3:1)}" height="${H-(framed?3:1)}" rx="${framed?2:4}"
      fill="${framed?"var(--busbar)":"var(--cell-hi)"}" opacity="${framed?1:.35}" stroke="${framed?"var(--muted)":"var(--line)"}" stroke-width="${framed?3:1}"/>${cells}</svg>`;
}

async function sendEmails(q){
  if (!window.emailjs) return { ok:false, reason:t("mailBlocked") };
  try{ emailjs.init({ publicKey: EMAILJS_KEY }); }catch(e){}
  const ja = q.lang === "ja";
  const toCustomer = emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
    to_email: q.email, reply_to: NOTIFY_EMAIL, from_name: EMAIL_FROM_NAME,
    subject: ja ? `【FINE-FLEX】お見積り依頼を受け付けました（${q.quote_no}）` : `[FINE-FLEX] We've received your quote request (${q.quote_no})`,
    message_html: customerEmail(q) });
  const toSilfine = emailjs.send(EMAILJS_SERVICE, EMAILJS_TEMPLATE, {
    to_email: NOTIFY_EMAIL, reply_to: q.email, from_name: EMAIL_FROM_NAME,
    subject: `【新規見積り依頼】${q.company || q.contact_name} 様 ${(+q.system_kw).toFixed(1)}kW ${yen(q.total)}（${q.quote_no}）`,
    message_html: alertEmail(q) });
  const [a, b] = await Promise.allSettled([toCustomer, toSilfine]);
  const why = r => r && (r.status || r.text) ? `${r.status ?? ""} ${r.text ?? ""}`.trim() : String(r && r.message || r);
  if (a.status === "rejected") console.error("Customer email failed", a.reason);
  if (b.status === "rejected") console.error("Alert email failed", b.reason);
  const failed = [a, b].find(x => x.status === "rejected");
  return failed ? { ok:false, reason:why(failed.reason) } : { ok:true };
}

/* Abuse protection (the free email plan has no domain lock):
   at most one request per 60 seconds and 5 per day from the same browser. */
const LIMIT_GAP_MS = 60*1000, LIMIT_PER_DAY = 5, LIMIT_KEY = "silfine-send-log";
function sendLog(){ try{ return JSON.parse(localStorage.getItem(LIMIT_KEY) || "[]"); }catch(e){ return []; } }
function checkLimit(){
  const now = Date.now(), log = sendLog().filter(ts => now - ts < 864e5);
  const last = log[log.length-1];
  if (last && now - last < LIMIT_GAP_MS) return t("errWait").replace("{n}", Math.ceil((LIMIT_GAP_MS - (now-last))/1000));
  if (log.length >= LIMIT_PER_DAY) return t("errDaily");
  return null;
}
function recordSend(){ try{ const now = Date.now(); const log = sendLog().filter(ts => now - ts < 864e5); log.push(now); localStorage.setItem(LIMIT_KEY, JSON.stringify(log)); }catch(e){} }

    options: { pcs: state.pcs, battery: state.battery, pref: state.pref, mode: state.mode,
               area: state.mode==="area" ? state.area : null, payback: c.payback ? +c.payback.toFixed(1) : null },
    lines: c.lines.map(l => ({k:l.k, note:l.note ?? null, v:l.v, qty:l.qty ?? null, unit:l.unit ?? null, up:l.up ?? null})),
    subtotal: c.sub, tax: c.tax, total: c.total, annual_kwh: c.gen, annual_savings: c.savings
  };

  const btn = $("#saveBtn"); btn.disabled = true;
  let msg;
  if (sb){
    const { error } = await sb.from("quotes").insert(row);
    btn.disabled = false;
    if (error){ console.error(error); toast(t("sendFail")); return; }
    recordSend();
    msg = t("sentOk");
  } else {
    btn.disabled = false;
    msg = t("savedDemo");
  }
  const copy = { ...row, created: now.toISOString(),
    valid: new Date(now.getTime() + SETTINGS.valid_days*864e5).toISOString().slice(0,10) };
  local.add(copy); renderSaved();
  showQuote(copy, msg);
  if (sb){
    let mailed;
    try{ mailed = await sendEmails(copy); }catch(e){ mailed = { ok:false, reason:String(e && e.message || e) }; }
    // the quote is already saved even if email fails
    const el = $("#dlgMsg");
    if (mailed.ok){ el.textContent = `${msg} ${t("mailSent").replace("{e}", copy.email)}`; }
    else { el.textContent = `${msg} ${t("mailFail").replace("{r}", mailed.reason)}`; el.style.color = "var(--danger)"; }
  }
}

function toast(m){
  const el = $("#toast"); el.textContent = m; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 3500);
}

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.lang){ state.lang = b.dataset.lang; renderAll(); }
  else if (b.dataset.model){ state.model = b.dataset.model; renderPanels(); renderSummary(); }
  else if (b.dataset.mode){
    state.mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach(x => x.setAttribute("aria-pressed", x.dataset.mode===state.mode));
    $("#countField").hidden = state.mode!=="count"; $("#areaField").hidden = state.mode!=="area";
    renderSummary();
  }
  else if (b.id==="minus" || b.id==="plus"){
    state.count = Math.max(1, Math.min(5000, (parseInt($("#count").value)||1) + (b.id==="plus"?1:-1)));
    $("#count").value = state.count; renderSummary();
  }
  else if (b.dataset.open){ const q = local.list().find(x => x.quote_no===b.dataset.open); if (q) showQuote(q); }
  else if (b.id==="saveBtn") submit();
  else if (b.id==="closeBtn") $("#dlg").close();
  else if (b.id==="printBtn" && openQuote){
    const w = window.open("", "_blank");
    if (w){ w.document.write(standaloneHTML(openQuote)); w.document.close(); w.focus(); setTimeout(() => w.print(), 400); }
  }
  else if (b.id==="dlBtn" && openQuote){
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([standaloneHTML(openQuote)], {type:"text/html"}));
    a.download = `${openQuote.quote_no}.html`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.name==="surface"){
    state.surface = el.value; state.model = surface(el.value).model;
    renderPanels(); renderInstalls(); renderSummary();
  }
  else if (el.name==="install"){ state.install = el.value; renderSummary(); }
  else if (el.id==="pcs"){ state.pcs = el.checked; renderSummary(); }
  else if (el.id==="battery"){ state.battery = el.value; renderSummary(); }
  else if (el.id==="pref"){ state.pref = +el.value; renderSummary(); }
});
document.addEventListener("input", e => {
  if (e.target.id==="count"){ state.count = parseInt(e.target.value)||1; renderSummary(); }
  else if (e.target.id==="area"){ state.area = parseFloat(e.target.value)||1; renderSummary(); }
});

/* ---------------- start ---------------- */
async function start(){
  renderAll();
  if (!SUPABASE_KEY || SUPABASE_KEY.startsWith("PASTE") || !window.supabase) return;
  try{
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const [prod, set] = await Promise.all([
      sb.from("products").select("*").eq("active", true).order("sort"),
      sb.from("settings").select("data").eq("id", 1).single()
    ]);
    if (prod.error || set.error) throw (prod.error || set.error);
    if (prod.data.length) PRODUCTS = prod.data.map(p => ({...p, weight_kg:+p.weight_kg, efficiency:+p.efficiency}));
    SETTINGS = { ...SETTINGS, ...set.data.data };
    if (!PRODUCTS.some(p => p.id === state.model)) state.model = PRODUCTS[0].id;
  }catch(e){
    console.error("Supabase connection failed, using offline data", e);
    sb = null;
  }
  renderAll();
}
start();
</script>
</body>
