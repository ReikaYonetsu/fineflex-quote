<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>見積り管理 | SILFINE JAPAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  try{ document.documentElement.dataset.theme = localStorage.getItem("silfine-theme") || "light"; }catch(e){ document.documentElement.dataset.theme = "light"; }
</script>
<style>
:root{
  --paper:#F4F6FB; --surface:#FFFFFF; --ink:#222631; --muted:#5E6675; --line:#DCE1EC;
  --cell:#1B3A93; --cell-hi:#2448C2; --sun:#F6D46B; --sun-ink:#4A3200;
  --ok:#2E7D4F; --danger:#C62828; --focus:#2448C2;
  --s-new:#2448C2; --s-contacted:#B7791F; --s-quoted:#6B4FA0; --s-won:#2E7D4F; --s-lost:#7A818A;
  --accent-text:#1B3A93; --hover:#EAF0FC;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --paper:#0E1322; --surface:#151C2E; --ink:#E6EAF3; --muted:#9AA4B8; --line:#2A3452;
  --cell:#2342A6; --cell-hi:#4F74DA; --ok:#5DBB86; --danger:#F08A82; --focus:#8FA8F0;
  --s-new:#8FA8F0; --s-contacted:#E2BE5A; --s-quoted:#B59BE0; --s-won:#5DBB86; --s-lost:#9AA4B8;
  --accent-text:#A9BCF2; --hover:#1E2B50; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;letter-spacing:.03em;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
a{color:var(--cell-hi)}
input,select,textarea{padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--focus);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:999px;border:0;cursor:pointer;font-weight:700;background:var(--cell);color:#fff}
.btn:hover{background:var(--cell-hi)}
.btn:disabled{opacity:.6;cursor:wait}
.btn.ghost{background:var(--surface);border:1.5px solid var(--cell-hi);color:var(--cell-hi);font-weight:500}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{background:transparent;border:1.5px solid var(--danger);color:var(--danger);font-weight:500}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.langs button{border:0;background:none;padding:5px 12px;cursor:pointer;font-size:13px}
.langs button[aria-pressed="true"]{background:var(--cell-hi);color:#fff}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login form{width:100%;max-width:360px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:28px}
.login .lhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.login .lhead h1{margin-right:auto}
.login h1{font-size:22px;margin:0 0 4px;color:var(--accent-text)}
.login p{color:var(--muted);font-size:13px;margin:0 0 20px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:500}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin:0 0 10px}

/* app */
header.top{background:var(--surface);border-bottom:3px solid var(--cell-hi)}
header.top .wrap{display:flex;align-items:center;gap:16px;min-height:58px;flex-wrap:wrap}
.brand{font-weight:700;font-size:15px;color:var(--accent-text)}
.brand b{font-family:"Poppins",sans-serif;font-size:20px;letter-spacing:.14em;display:block;line-height:1.2}
.brand small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;margin-right:auto}
nav.tabs button{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--hover);color:var(--accent-text)}
.who{font-size:13px;color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:24px 0 20px}
@media (max-width:800px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);padding:14px 16px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-family:"Poppins","Noto Sans JP",sans-serif;font-size:24px;font-weight:700;line-height:1.3;color:var(--accent-text)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13px}
.chips button[aria-pressed="true"]{background:var(--cell-hi);border-color:var(--cell-hi);color:#fff}
.chips .c{opacity:.7;margin-left:4px}
.toolbar input[type=search]{max-width:280px}
.toolbar .spacer{margin-left:auto;display:flex;gap:8px}

.table-wrap{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px;background:var(--surface);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:color-mix(in srgb,var(--cell-hi) 6%,transparent)}
.r{text-align:right}
.cust b{display:block;font-weight:500}
.cust small{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--muted);white-space:normal}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st-new{color:var(--s-new)} .st-contacted{color:var(--s-contacted)} .st-quoted{color:var(--s-quoted)} .st-won{color:var(--s-won)} .st-lost{color:var(--s-lost)}
.foot{font-size:12px;color:var(--muted);margin:10px 0 40px}

/* detail drawer */
dialog{border:0;padding:0;margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(560px,100vw);max-width:100vw;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(10,15,22,.45)}
.drawer{display:flex;flex-direction:column;height:100%}
.d-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.d-head h2{margin:0;font-size:18px}
.d-head small{color:var(--muted)}
.d-head .btn{margin-left:auto}
.d-body{padding:18px 22px;overflow:auto;flex:1}
.d-sec{margin-bottom:22px}
.d-sec h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 8px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.lines{width:100%;font-size:13.5px}
.lines td{padding:5px 0;border:0;white-space:normal}
.lines td:last-child{text-align:right;white-space:nowrap}
.lines tr.t td{border-top:1px solid var(--line);font-weight:700;padding-top:8px}
.d-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.d-foot .btn.danger{margin-left:auto}

/* pricing */
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;margin:24px 0 40px;align-items:start}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:10px}
.card h2{font-size:16px;margin:0;padding:14px 16px;color:#fff;background:var(--cell-hi);border-radius:8px 8px 0 0;letter-spacing:.1em}
.card .body{padding:16px}
.card table td input,.card table td select{padding:6px 8px;min-width:90px}
.card table td input[type=checkbox]{width:18px;height:18px;min-width:0;accent-color:var(--cell-hi)}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.set-grid .field{margin:0}
.set-grid h4{grid-column:1/-1;margin:10px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.card .actions{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card .actions .msg{font-size:13px;color:var(--ok)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.toast.show{opacity:1}
.brand img{display:block;height:38px;width:auto}
.brand .logo-dark{display:none}
:root[data-theme="dark"] .brand .logo-light{display:none}
:root[data-theme="dark"] .brand .logo-dark{display:block}
.theme-btn{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--cell-hi);background:var(--surface);color:var(--cell-hi);cursor:pointer;display:grid;place-items:center}
.theme-btn:hover{background:var(--hover)}
.theme-btn svg{width:17px;height:17px}
.theme-btn .sun{display:none}
:root[data-theme="dark"] .theme-btn .moon{display:none}
:root[data-theme="dark"] .theme-btn .sun{display:block}
.login .logo{display:block;height:44px;width:auto;margin-bottom:14px}
.login .logo-dark{display:none}
:root[data-theme="dark"] .login .logo-light{display:none}
:root[data-theme="dark"] .login .logo-dark{display:block}
.hdr-tools{display:flex;align-items:center;gap:10px}
@media (max-width:760px){
  header.top .wrap{gap:10px;padding-top:8px;padding-bottom:8px}
  nav.tabs{order:3;width:100%;margin-right:0}
  nav.tabs button{flex:1}
  .who{display:none}
  .hdr-tools{margin-left:auto}
  .wrap{padding:0 14px}
  .kpis{margin:16px 0 14px}
  .kpi{padding:10px 12px} .kpi b{font-size:18px}
  .toolbar input[type=search]{max-width:none;order:2}
  .toolbar .spacer{margin-left:0;width:100%;order:3}
  .toolbar .spacer .btn{flex:1}
  .d-head,.d-body,.d-foot{padding-left:16px;padding-right:16px}
  .kv{grid-template-columns:100px 1fr}
  .set-grid{grid-template-columns:1fr}
  .kpi:last-child{grid-column:1/-1}
}
.d-head .btn,.btn{white-space:nowrap}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="loginView">
  <form id="loginForm" novalidate>
    <img class="logo logo-light" src="img/logo.png" alt="SILFINE JAPAN" width="200" height="68">
    <img class="logo logo-dark" src="img/flogo.png" alt="SILFINE JAPAN" width="200" height="68">
    <div class="lhead">
      <h1 data-t="loginTitle"></h1>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="theme-btn" data-theme-toggle>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
    </div>
    <p data-t="loginSub"></p>
    <div class="field"><label for="email" data-t="email"></label><input type="email" id="email" autocomplete="username" required></div>
    <div class="field"><label for="password" data-t="password"></label><input type="password" id="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" type="submit" id="loginBtn" style="width:100%" data-t="login"></button>
  </form>
</div>

<!-- APP -->
<div id="appView" hidden>
  <header class="top">
    <div class="wrap">
      <div class="brand"><img class="logo-light" src="img/logo.png" alt="SILFINE JAPAN" width="200" height="68"><img class="logo-dark" src="img/flogo.png" alt="SILFINE JAPAN" width="200" height="68"><small data-t="brandSub"></small></div>
      <nav class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="quotes" aria-selected="true" data-t="tabQuotes"></button>
        <button type="button" role="tab" data-tab="pricing" aria-selected="false" data-t="tabPricing"></button>
      </nav>
      <span class="who" id="who"></span>
      <div class="hdr-tools">
      <div class="langs" role="group" aria-label="Language">
        <button type="button" data-lang="ja" aria-pressed="true">日本語</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="theme-btn" data-theme-toggle>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
      </button>
      <button type="button" class="btn ghost" id="logoutBtn" data-t="logout"></button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="quotesView">
      <div class="kpis num" id="kpis"></div>
      <div class="toolbar">
        <div class="chips" id="chips"></div>
        <input type="search" id="search">
        <div class="spacer">
          <button type="button" class="btn ghost" id="refreshBtn" data-t="refresh"></button>
          <button type="button" class="btn ghost" id="csvBtn" data-t="csv"></button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="num">
          <thead><tr>
            <th data-t="thDate"></th><th data-t="thNo"></th><th data-t="thCust"></th><th data-t="thPref"></th><th data-t="thSurface"></th>
            <th data-t="thModel"></th><th class="r" data-t="thKw"></th><th class="r" data-t="thTotal"></th><th data-t="thStatus"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p class="foot" id="foot"></p>
    </section>

    <section id="pricingView" hidden>
      <div class="grid2">
        <div class="card">
          <h2 data-t="prodTitle"></h2>
          <div style="overflow-x:auto">
            <table class="num"><thead><tr><th data-t="pModel"></th><th class="r" data-t="pOut"></th><th data-t="pPrice"></th><th data-t="pStock"></th><th data-t="pShow"></th></tr></thead>
              <tbody id="prodRows"></tbody></table>
          </div>
          <div class="actions"><button type="button" class="btn" id="saveProducts" data-t="saveProducts"></button><span class="msg" id="prodMsg"></span></div>
        </div>
        <div class="card">
          <h2 data-t="setTitle"></h2>
          <div class="body"><div class="set-grid num" id="setForm"></div></div>
          <div class="actions"><button type="button" class="btn" id="saveSettings" data-t="saveSettings"></button><span class="msg" id="setMsg"></span></div>
        </div>
      </div>
    </section>
  </main>
</div>

<dialog id="drawer" aria-labelledby="dTitle">
  <div class="drawer">
    <div class="d-head">
      <div><h2 id="dTitle" class="num"></h2><small id="dSub" class="num"></small></div>
      <button type="button" class="btn ghost" id="dClose" data-t="close"></button>
    </div>
    <div class="d-body" id="dBody"></div>
    <div class="d-foot">
      <button type="button" class="btn" id="dSave" data-t="save"></button>
      <button type="button" class="btn danger" id="dDelete" data-t="delete"></button>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status"></div>

function applyText(){
  document.documentElement.lang = LANG;

  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });

/* ---------------- auth ---------------- */
async function boot(){
  applyText();
  const { data:{ session } } = await sb.auth.getSession();
  session ? enter(session) : showLogin();
}
function showLogin(){ $("#appView").hidden = true; $("#loginView").hidden = false; }
async function enter(session){
  $("#loginView").hidden = true; $("#appView").hidden = false;
  $("#who").textContent = session.user.email;
  await loadQuotes();
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#loginBtn"), err = $("#loginErr");
  err.textContent = ""; btn.disabled = true;
  const { data, error } = await sb.auth.signInWithPassword({ email:$("#email").value.trim(), password:$("#password").value });
  btn.disabled = false;
  if (error){ err.textContent = t("loginErr"); return; }
  $("#password").value = "";

});
$("#logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); QUOTES = []; SETTINGS = null; showLogin(); });

/* ---------------- quotes ---------------- */
async function loadQuotes(){
  const { data, error } = await sb.from("quotes").select("*").order("created_at", { ascending:false }).limit(1000);
  if (error){ toast(t("loadFail")); console.error(error); return; }
  QUOTES = data; renderQuotes();
}
function visible(){
  const q = query.toLowerCase();
  return QUOTES.filter(r => (filter === "all" || r.status === filter) &&
    (!q || [r.company, r.contact_name, r.furigana, r.email, r.quote_no, r.phone].some(v => (v || "").toLowerCase().includes(q))));
}
function renderQuotes(){
  const open = QUOTES.filter(r => ["new","contacted","quoted"].includes(r.status));
  const won = QUOTES.filter(r => r.status === "won");
  const monthStart = new Date(); monthStart.setDate(1); monthStart.setHours(0,0,0,0);
  $("#kpis").innerHTML = `
    <div class="kpi"><span>${t("kNew")}</span><b>${QUOTES.filter(r => r.status==="new").length}</b></div>
    <div class="kpi"><span>${t("kMonth")}</span><b>${QUOTES.filter(r => new Date(r.created_at) >= monthStart).length}</b></div>
    <div class="kpi"><span>${t("kOpen")}</span><b>${yen(open.reduce((a,r) => a + r.total, 0))}</b></div>
    <div class="kpi"><span>${t("kOpenKw")}</span><b>${open.reduce((a,r) => a + +r.system_kw, 0).toFixed(1)} kW</b></div>
    <div class="kpi"><span>${t("kWon")}</span><b>${yen(won.reduce((a,r) => a + r.total, 0))}</b></div>`;
  const counts = s => s === "all" ? QUOTES.length : QUOTES.filter(r => r.status === s).length;
  $("#chips").innerHTML = ["all", ...Object.keys(STATUSES)].map(s =>
    `<button type="button" data-filter="${s}" aria-pressed="${filter===s}">${s==="all" ? t("all") : L(STATUSES, s)}<span class="c">${counts(s)}</span></button>`).join("");
  const list = visible();
  $("#rows").innerHTML = !list.length
    ? `<tr><td colspan="9" class="empty">${QUOTES.length ? t("noMatch") : t("noQuotes")}</td></tr>`
    : list.map(r => `<tr class="row" data-id="${r.id}">
        <td>${dt(r.created_at)}</td><td>${esc(r.quote_no)}</td>
        <td class="cust"><b>${esc(r.company || r.contact_name)}</b><small>${r.company ? esc(r.contact_name) : esc(r.email)}</small></td>
        <td>${pref(r)}</td><td>${L(SURFACES, r.surface_type)}</td>

        <td class="r">${yen(r.total)}</td><td><span class="status st-${r.status}">${L(STATUSES, r.status)}</span></td></tr>`).join("");

}

async function saveCurrent(){
  if (!current) return;
  const patch = { status:$("#dStatus").value, admin_notes:$("#dNotes").value.trim() || null };
  const btn = $("#dSave"); btn.disabled = true;
  const { error } = await sb.from("quotes").update(patch).eq("id", current.id);
  btn.disabled = false;
  if (error){ toast(t("saveFail")); console.error(error); return; }
  Object.assign(current, patch); renderQuotes(); $("#drawer").close(); current = null; toast(t("saved"));
}
async function deleteCurrent(){
  if (!current || !confirm(t("confirmDel", {n:current.quote_no}))) return;
  const { error } = await sb.from("quotes").delete().eq("id", current.id);
  if (error){ toast(t("delFail")); console.error(error); return; }
  QUOTES = QUOTES.filter(x => x.id !== current.id); renderQuotes(); $("#drawer").close(); current = null; toast(t("deleted"));
}

function exportCSV(){
  const cols = [[t("thDate"),r=>dt(r.created_at)],[t("thNo"),r=>r.quote_no],[t("thStatus"),r=>L(STATUSES,r.status)],[t("company"),r=>r.company],
    [t("contact"),r=>r.contact_name],["ふりがな / furigana",r=>r.furigana],[t("mail"),r=>r.email],[t("phone"),r=>r.phone],["〒",r=>r.postal_code],[t("address"),r=>r.address],
    [t("surface"),r=>L(SURFACES,r.surface_type)],[t("method"),r=>L(METHODS,r.install_method)],[t("pModel"),r=>r.model],[t("panel"),r=>r.panel_count],
    ["kW",r=>r.system_kw],[t("sub"),r=>r.subtotal],[t("tax"),r=>r.tax],[t("total"),r=>r.total],[t("gen")+" (kWh)",r=>r.annual_kwh],
    [t("savings"),r=>r.annual_savings],[t("req"),r=>r.notes],[t("sNotes"),r=>r.admin_notes]];
  const cell = v => { const s = String(v ?? ""); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const csv = [cols.map(c => cell(c[0])).join(","), ...visible().map(r => cols.map(c => cell(c[1](r))).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8"}));
  a.download = `fineflex-${t("csvName")}-${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function loadPricing(){
  const [p, s] = await Promise.all([
    sb.from("products").select("*").order("sort"),
    sb.from("settings").select("data").eq("id", 1).single()
  ]);
  if (p.error || s.error){ toast(t("pricingFail")); console.error(p.error || s.error); return; }
  PRODUCTS = p.data; SETTINGS = s.data.data; renderPricing();
}
function renderPricing(){
  // keep unsaved edits when re-rendering for a language switch
  const edits = {};
  document.querySelectorAll("#prodRows tr").forEach(tr => { edits[tr.dataset.pid] = {

    ${f("install_per_kw.grip_rack",t("fGrip"),S.install_per_kw.grip_rack,"1000")}
    ${f("install_per_kw.adhesive_mech",t("fAdhMech"),S.install_per_kw.adhesive_mech,"1000")}
    <h4>${t("gOther")}</h4>
    ${f("survey_fee",t("fSurvey"),S.survey_fee,"1000")}
    ${f("pcs_per_kw",t("fPcs"),S.pcs_per_kw,"1000")}
    <h4>${t("gShip")}</h4>
    ${f("shipping_per_50.kyushu",t("fKyushu"),S.shipping_per_50.kyushu,"1000")}
    ${f("shipping_per_50.honshu",t("fHonshu"),S.shipping_per_50.honshu,"1000")}
    ${f("shipping_per_50.remote",t("fRemote"),S.shipping_per_50.remote,"1000")}
    <h4>${t("gDisc")}</h4>
    ${d.map((x,i) => f(`vd.${i}.min`,t("fTierMin",{n:i+1}),x.min) + f(`vd.${i}.rate`,t("fTierRate",{n:i+1}),Math.round(x.rate*100))).join("")}
    <h4>${t("gAssume")}</h4>
    ${f("yield_kwh_per_kw",t("fYield"),S.yield_kwh_per_kw,"10")}
    ${f("electricity_yen_per_kwh",t("fElec"),S.electricity_yen_per_kwh,"0.5")}
    ${f("valid_days",t("fValid"),S.valid_days)}`;
}
async function saveProducts(){
  const rows = [...document.querySelectorAll("#prodRows tr")].map(tr => {
    const g = f => tr.querySelector(`[data-f="${f}"]`);
    return { id:tr.dataset.pid, price_jpy:Math.max(0, parseInt(g("price_jpy").value) || 0), stock:g("stock").value, active:g("active").checked };
  });
  const btn = $("#saveProducts"); btn.disabled = true;
  const results = await Promise.all(rows.map(r => sb.from("products").update({price_jpy:r.price_jpy, stock:r.stock, active:r.active}).eq("id", r.id)));
  btn.disabled = false;
  const failed = results.find(r => r.error);
  if (failed){ toast(t("saveFail")); console.error(failed.error); return; }
  rows.forEach(r => Object.assign(PRODUCTS.find(p => p.id === r.id), r));
  $("#prodMsg").textContent = t("appliedMsg");
  setTimeout(() => $("#prodMsg").textContent = "", 4000);
}
async function saveSettings(){
  const S = structuredClone(SETTINGS);
  const vd = S.volume_discounts.slice().sort((a,b) => a.min - b.min).map(x => ({...x}));
  document.querySelectorAll("#setForm [data-k]").forEach(inp => {
    const v = parseFloat(inp.value); if (isNaN(v)) return;
    const k = inp.dataset.k.split(".");
    if (k[0] === "vd"){ vd[+k[1]][k[2]] = k[2] === "rate" ? v/100 : Math.round(v); }
    else if (k.length === 2){ S[k[0]][k[1]] = v; }
    else { S[k[0]] = v; }
  });
  S.volume_discounts = vd.sort((a,b) => b.min - a.min);
  const btn = $("#saveSettings"); btn.disabled = true;
  const { error } = await sb.from("settings").update({ data:S, updated_at:new Date().toISOString() }).eq("id", 1);
  btn.disabled = false;
  if (error){ toast(t("saveFail")); console.error(error); return; }
  SETTINGS = S;
  $("#setMsg").textContent = t("appliedMsg");
  setTimeout(() => $("#setMsg").textContent = "", 4000);
}

/* ---------------- events ---------------- */
document.addEventListener("click", e => {
  const b = e.target.closest("button, tr.row"); if (!b) return;
  if (b.matches("tr.row")) openDrawer(b.dataset.id);
  else if (b.dataset.lang) setLang(b.dataset.lang);
  else if (b.hasAttribute("data-theme-toggle")){
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try{ localStorage.setItem("silfine-theme", next); }catch(e){}
    applyText();
  }
  else if (b.dataset.filter){ filter = b.dataset.filter; renderQuotes(); }
  else if (b.dataset.tab){
    document.querySelectorAll("[data-tab]").forEach(x => x.setAttribute("aria-selected", x === b));
    $("#quotesView").hidden = b.dataset.tab !== "quotes"; $("#pricingView").hidden = b.dataset.tab !== "pricing";
    if (b.dataset.tab === "pricing" && !SETTINGS) loadPricing();
  }
  else if (b.id === "refreshBtn") loadQuotes().then(() => toast(t("refreshed")));
  else if (b.id === "csvBtn") exportCSV();
  else if (b.id === "dClose"){ $("#drawer").close(); current = null; }
  else if (b.id === "dSave") saveCurrent();
  else if (b.id === "dDelete") deleteCurrent();
  else if (b.id === "saveProducts") saveProducts();
  else if (b.id === "saveSettings") saveSettings();
});
$("#drawer").addEventListener("close", () => { current = null; });
$("#search").addEventListener("input", e => { query = e.target.value.trim(); renderQuotes(); });

boot();
</script>
</body>
</html>
